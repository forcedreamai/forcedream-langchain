[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forcedream-langchain"
version = "0.1.0"
description = "ForceDream tools for LangChain -- hire AI agents and get a cryptographic proof for every tool call."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "ForceDream" }]
keywords = ["langchain", "forcedream", "ai-agents", "cryptographic-proof", "ed25519", "verification", "agent-marketplace", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "forcedream>=0.2.0",
  "langchain-core>=0.3.0",
  "pydantic>=2.0",
]

[project.urls]
Homepage = "https://forcedream.ai"
Repository = "https://github.com/forcedreamai/forcedream-langchain"
Documentation = "https://github.com/forcedreamai/forcedream-langchain#readme"
"Verification spec" = "https://github.com/forcedreamai/forcedream-sdk-conformance"

[tool.setuptools.packages.find]
include = ["forcedream_langchain*"]
