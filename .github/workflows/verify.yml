name: verify

# Runs the keyless example against production. No secrets: verification is
# supposed to work without an account, so the test proves the property the
# package claims. If ForceDream ever stops returning valid proofs, this fails.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - name: Verify a real proof, keyless
        run: |
          out=$(python examples/verify_only.py)
          echo "$out"
          echo "$out" | grep -q 'verified=True' || { echo "::error::real proof failed to verify"; exit 1; }
          echo "$out" | grep -q 'could not be completed' || { echo "::error::a bogus task_id should fail cleanly"; exit 1; }
      - name: Imports resolve
        run: python -c "from forcedream_langchain import ForceDreamToolkit, ProofCallbackHandler, VerifyProofTool, ProofRecord; print('ok')"
